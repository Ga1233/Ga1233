<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
--bg:#F4F6FC;--surface:#fff;--ink:#12172E;--muted:#586080;--line:#DDE2F0;--accent:#3548FF;--accent-ink:#fff;--sun:#FFD23F;--tint:#E8ECFB;
--display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0C1124;--surface:#141B34;--ink:#EAEEFF;--muted:#98A2C8;--line:#252E50;--accent:#8A98FF;--accent-ink:#0C1124;--tint:#121A33}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0C1124;--surface:#141B34;--ink:#EAEEFF;--muted:#98A2C8;--line:#252E50;--accent:#8A98FF;--accent-ink:#0C1124;--tint:#121A33}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.65 var(--body);overflow-x:clip}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:12}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding-left:24px;padding-right:24px}
.lead{color:var(--muted);font-size:1.12rem;max-width:58ch;margin:0 0 18px}

/* nav: floating pill */
nav.top{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:11;margin:12px auto 0;width:max-content;max-width:calc(100% - 24px)}
nav.top .in{display:flex;align-items:center;gap:2px;padding:6px;border:1px solid var(--line);border-radius:999px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);overflow-x:auto;scrollbar-width:none}
nav.top a,nav.top button{font:inherit;font-size:.92rem;padding:8px 14px;border-radius:999px;color:var(--muted);text-decoration:none;white-space:nowrap;background:none;border:0;cursor:pointer}
nav.top a:hover,nav.top button:hover{background:var(--tint);color:var(--ink)}
nav.top a.mark{background:var(--accent);color:var(--accent-ink);font-weight:600}

/* hero: the memorable moment */
.hero{display:grid;gap:44px;grid-template-columns:1fr;align-items:center;padding-top:56px;padding-bottom:40px}
@media (min-width:860px){.hero{grid-template-columns:1.3fr .7fr;padding-top:84px}}
.status{display:inline-flex;gap:10px;align-items:center;margin:0 0 22px;padding:6px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:.9rem}
.status i{width:8px;height:8px;border-radius:50%;background:#1DB56B}
h1{font:800 clamp(3.4rem,12.5vw,7.6rem)/.9 var(--display);letter-spacing:-.045em;margin:0 0 22px}
.role{font:600 1.3rem/1.3 var(--display);margin:0 0 14px}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.btn{display:inline-block;padding:12px 22px;border-radius:999px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:600;border:1px solid var(--accent)}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.alt:hover{border-color:var(--ink)}
.portrait{margin:0;justify-self:center;width:min(340px,78%);position:relative}
.portrait::before{content:"";position:absolute;inset:18px -18px -18px 18px;border-radius:999px 999px 28px 28px;background:var(--accent)}
.portrait::after{content:"";position:absolute;width:72px;height:72px;border-radius:50%;background:var(--sun);left:-24px;bottom:56px;z-index:2}
.frame{position:relative;z-index:1;aspect-ratio:4/5;border-radius:999px 999px 28px 28px;overflow:hidden;background:var(--tint)}
.frame img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;display:block}
.ph{height:100%;display:flex;align-items:center;justify-content:center;font:800 4rem var(--display);color:var(--accent)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.hero-copy>*{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.hero-copy>*:nth-child(2){animation-delay:.07s}.hero-copy>*:nth-child(3){animation-delay:.14s}
.hero-copy>*:nth-child(4){animation-delay:.21s}.hero-copy>*:nth-child(5){animation-delay:.28s}
.portrait{animation:rise .9s .2s cubic-bezier(.2,.7,.2,1) both}

/* sections */
.sec{padding-top:76px;padding-bottom:8px}
.sec h2{font:700 clamp(2rem,5vw,3rem)/1.05 var(--display);letter-spacing:-.03em;margin:0 0 28px}
.sub{font:600 1.2rem var(--display);margin:12px 0 18px}
.about{display:grid;gap:36px}
@media (min-width:860px){.about{grid-template-columns:1.35fr 1fr;gap:64px}}
.about .lead{font-size:1.25rem;color:var(--ink);max-width:60ch}
dl.facts{margin:0;border-top:1px solid var(--line);align-self:start}
.facts div{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.facts dt{color:var(--muted)}.facts dd{margin:0;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.chip{padding:6px 16px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:.95rem}

/* experience timeline: a real sequence */
.tl{list-style:none;margin:0 0 36px;padding:0}
.tl li{display:grid;gap:6px;padding:0 0 30px 28px;margin-left:6px;position:relative;border-left:2px solid var(--line)}
.tl li:last-child{padding-bottom:4px}
.tl li::before{content:"";position:absolute;left:-8px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--bg)}
@media (min-width:760px){.tl li{grid-template-columns:210px 1fr;gap:32px}}
.tl-when{display:flex;flex-direction:column;color:var(--muted);font-size:.92rem}
.tl h3{font:600 1.35rem/1.25 var(--display);letter-spacing:-.01em;margin:0}
.org{color:var(--accent);font-weight:600;margin:2px 0 6px}
.tl p.d{margin:0;color:var(--muted);max-width:60ch}
.certs{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));column-gap:36px}
.certs li{padding:12px 0;border-bottom:1px solid var(--line)}

/* featured projects */
.projs{display:grid;gap:20px;grid-template-columns:1fr}
@media (min-width:760px){.projs{grid-template-columns:1fr 1fr}.proj.wide{grid-column:1/-1}}
.proj{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:12px}
.proj h3{font:700 1.5rem/1.15 var(--display);letter-spacing:-.02em;margin:0}
.proj.wide h3{font-size:2.1rem}
.proj p{margin:0;color:var(--muted);max-width:62ch}
.tags{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:auto 0 0;padding:14px 0 0}
.tags li{padding:3px 10px;border-radius:6px;background:var(--tint);font-size:.82rem}
.plink{font-weight:600;text-underline-offset:4px;align-self:flex-start}

/* github */
.badge{display:inline-flex;align-items:center;gap:8px;font:500 .8rem var(--body);letter-spacing:0;padding:3px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-left:12px;vertical-align:middle}
.repos{list-style:none;margin:0 0 40px;padding:0;border-top:1px solid var(--line)}
.repos a{display:grid;gap:4px 24px;padding:18px 4px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
@media (min-width:760px){.repos a{grid-template-columns:270px 1fr auto;align-items:baseline}}
.rname{font:600 1.2rem var(--display)}
.repos a:hover .rname,.repos a:focus-visible .rname{color:var(--accent)}
.rdesc{color:var(--muted)}.rmeta{display:flex;gap:14px;color:var(--muted);font-size:.9rem}
ul.feed{list-style:none;padding:0;margin:0}
ul.feed li{padding:11px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
ul.feed time{color:var(--muted);white-space:nowrap}
.skel{height:92px;border-radius:14px;background:var(--line);animation:p 1.2s infinite alternate}
@keyframes p{to{opacity:.4}}

.note{color:var(--muted);font-size:.88rem;margin:14px 0 0;max-width:60ch}

/* contact */
.panel{display:grid;gap:36px;padding:clamp(24px,5vw,56px);border-radius:28px;background:var(--tint)}
@media (min-width:860px){.panel{grid-template-columns:1fr 1.1fr}}
.links{display:flex;flex-wrap:wrap;gap:18px;margin:6px 0 0;padding:0;list-style:none}
form.contact{display:grid;gap:14px}
.contact label{display:grid;gap:6px;font-size:.92rem;color:var(--muted)}
.contact input,.contact textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
.contact textarea{min-height:140px;resize:vertical}
.contact button.btn{justify-self:start;cursor:pointer;font:inherit;font-weight:600}
.contact button:disabled{opacity:.6;cursor:default}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
footer{margin-top:72px;padding:28px 0 36px;color:var(--muted);font-size:.9rem;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

    { name: "Nexus — Real-Time Chat App", tech: "React • Node.js • Express • MongoDB • Socket.io • IndexedDB", desc: "Full-stack MERN chat app with instant messaging over WebSockets, local message persistence and a responsive interface.", url: "https://chat-app-ashy-eta-26.vercel.app/", label: "Live demo" },
    { name: "Garage AC Inventory System", tech: "React • Node.js • Express • Supabase", desc: "Inventory management for automobile AC parts: stock in/out, supplier management, low-stock alerts, owner/staff roles and reports." }
  ],
  learning: ["Advanced React & Node.js", "Cybersecurity & Web Security", "DevOps & Cloud", "Open Source"],
  experience: [], education: [], certifications: []   // filled automatically from profile.json on GitHub
};

/* ───────── 2. Fallback data, used if GitHub can’t be reached ───────── */
const SAMPLE_REPOS = [
  { id: 1, name: "AI-Web-Vulnerability-Scanner", description: "AI-assisted web vulnerability scanner.", html_url: "https://github.com/Ga1233/AI-Web-Vulnerability-Scanner", stargazers_count: 0, language: "Python" },
  { id: 2, name: "secure-auth", description: "JWT access/refresh authentication with React and Express.", html_url: "https://github.com/Ga1233/secure-auth", stargazers_count: 0, language: "JavaScript" },
  { id: 3, name: "audit-ally", description: "Public repository on GitHub.", html_url: "https://github.com/Ga1233/audit-ally", stargazers_count: 0, language: "TypeScript" },
  { id: 4, name: "Portfolio-Website", description: "My portfolio website.", html_url: "https://github.com/Ga1233/Portfolio-Website", stargazers_count: 0, language: "HTML" }
];
const SAMPLE_EVENTS = []; // no made-up activity; real events load once the site is hosted

/* ───────── 3. Data hook: fetches on load, refreshes every 10 min, never breaks the page ───────── */
function useGithub(user) {
  const [state, setState] = useState({ status: "loading", repos: [], events: [] });
  useEffect(() => {
    let alive = true;
    const load = async () => {
      const key = "gh-cache:" + user;
      try {
        // reuse a fresh result so repeated page loads don’t use up GitHub’s anonymous rate limit (60/hour)
        try {
          const c = JSON.parse(localStorage.getItem(key) || "null");
          if (c && Date.now() - c.t < 5 * 60 * 1000) { if (alive) setState(c.s); return; }
        } catch (e1) { /* storage unavailable */ }
        const base = `https://api.github.com/users/${encodeURIComponent(user)}`;
        const [r, e] = await Promise.all([
          fetch(`${base}/repos?sort=pushed&per_page=30`),
          fetch(`${base}/events/public?per_page=10`).catch(() => null) // activity is optional
        ]);
        if (!r.ok) throw new Error("GitHub request failed (" + r.status + ")");
        const all = (await r.json()).filter(x => !x.fork);
        const repos = [...all].sort((a, b) => b.stargazers_count - a.stargazers_count).slice(0, 6);
        // fallback activity: the most recently pushed repositories (real data from the repo list)
        const recent = [...all].sort((a, b) => new Date(b.pushed_at) - new Date(a.pushed_at)).slice(0, 6)
          .map(x => ({ id: x.id, name: x.name, url: x.html_url, at: x.pushed_at }));
        const eventsOk = !!(e && e.ok);
        const events = eventsOk ? await e.json() : [];
        const st = { status: "live", repos, events, recent, eventsOk };
        try { localStorage.setItem(key, JSON.stringify({ t: Date.now(), s: st })); } catch (e2) { /* ignore */ }
        if (alive) setState(st);
      } catch (err) {
        console.warn("GitHub data could not be loaded:", err);
        if (alive) setState({ status: "sample", repos: SAMPLE_REPOS, events: SAMPLE_EVENTS, recent: [], eventsOk: false });
      }
    };
    load();
    const t = setInterval(load, 10 * 60 * 1000);
    return () => { alive = false; clearInterval(t); };
  }, [user]);
  return state;
}

/* ───────── Live profile: merges (defaults < GitHub bio < profile.json in your GitHub repo) ─────────
   Edit https://github.com/<user>/<user>/blob/main/profile.json on GitHub and the site updates on the next visit.
   Everything from the remote file is type-checked and URLs are limited to http(s). */
const str = v => (typeof v === "string" ? v : "");
const safeUrl = u => (/^https?:\/\//i.test(str(u)) ? u : undefined);
const strList = a => (Array.isArray(a) ? a.filter(x => typeof x === "string") : null);
const objList = (a, keys) => (Array.isArray(a) ? a.filter(x => x && typeof x === "object").map(x => Object.fromEntries(keys.map(k => [k, str(x[k])]))) : null);

function useProfile() {
  const [C, setC] = useState(CONFIG);
  useEffect(() => {
    let alive = true;
    (async () => {
      try {
        const u = encodeURIComponent(CONFIG.githubUser);
        const [gu, pj] = await Promise.allSettled([
          fetch(`https://api.github.com/users/${u}`).then(r => (r.ok ? r.json() : null)),
          fetch(`https://raw.githubusercontent.com/${u}/${u}/main/profile.json`).then(r => (r.ok ? r.json() : null))
        ]);
        const g = gu.value || {}, p = pj.value || {};
        const next = { ...CONFIG };
        if (str(g.bio).trim()) next.bio = g.bio;                       // live GitHub bio
        ["title", "bio", "about", "email", "location"].forEach(k => { if (str(p[k]).trim()) next[k] = p[k]; });
        if (safeUrl(p.linkedinUrl)) next.linkedinUrl = p.linkedinUrl;
        const sk = strList(p.skills), ln = strList(p.learning), ce = strList(p.certifications);
        if (sk) next.skills = sk; if (ln) next.learning = ln; if (ce) next.certifications = ce;
        const ex = objList(p.experience, ["role", "org", "when", "location", "desc"]); if (ex) next.experience = ex;
        const ed = objList(p.education, ["school", "degree", "when", "desc"]); if (ed) next.education = ed;
        const ft = objList(p.featured, ["name", "tech", "desc", "url", "label"]);
        if (ft) next.featured = ft;
        next.featured = next.featured.map(f => ({ ...f, url: safeUrl(f.url) }));
        if (alive) setC(next);
      } catch (e) { /* keep defaults */ }
    })();
    return () => { alive = false; };
  }, []);
  return C;
}

/* ───────── 4. UI components ───────── */
const LABELS = { PushEvent: "Pushed to", PullRequestEvent: "Pull request in", IssuesEvent: "Issue in",
  CreateEvent: "Created", WatchEvent: "Starred", ForkEvent: "Forked", IssueCommentEvent: "Commented in" };

function ago(iso) {
  const h = Math.max(1, Math.round((Date.now() - new Date(iso)) / 36e5));
  return h < 24 ? `${h}h ago` : `${Math.round(h / 24)}d ago`;
}
const tags = t => str(t).split(/[•|,]/).map(x => x.trim()).filter(Boolean);

/* Hero portrait: your photo in an arch frame, or initials if the image can’t load */
function Portrait({ C }) {
  const [failed, setFailed] = useState(false);
  const initials = C.name.split(" ").map(w => w[0]).join("").slice(0, 2);
  return html`<figure class="portrait"><div class="frame">
    ${failed || !C.photo
      ? html`<div class="ph" role="img" aria-label=${C.photoAlt}>${initials}</div>`
      : html`<img src=${C.photo} alt=${C.photoAlt} onError=${() => setFailed(true)} />`}
  </div></figure>`;
}

function Repos({ gh }) {
  if (gh.status === "loading") return html`<div class="skel"></div>`;
  if (!gh.repos.length) return html`<p class="lead">${gh.status === "live" ? "No public repositories to show yet." : "Repositories couldn’t load right now. GitHub may be limiting requests, so try again in a few minutes."}</p>`;
  return html`<ul class="repos">${gh.repos.map(r => html`<li key=${r.id}>
    <a href=${r.html_url} target="_blank" rel="noopener noreferrer">
      <span class="rname">${r.name}</span>
      <span class="rdesc">${r.description || "No description yet."}</span>
      <span class="rmeta">${r.language}${r.stargazers_count > 0 && html`<span>★ ${r.stargazers_count}</span>`}</span>
    </a></li>`)}</ul>`;
}

function Activity({ gh }) {
  if (gh.status === "loading") return html`<div class="skel"></div>`;
  if (gh.events.length) return html`<ul class="feed">${gh.events.slice(0, 6).map(ev => html`
    <li key=${ev.id}><span>${LABELS[ev.type] || ev.type.replace("Event", "")} <strong>${ev.repo.name}</strong></span><time>${ago(ev.created_at)}</time></li>`)}</ul>`;
  if (gh.recent && gh.recent.length) return html`<div>
    <ul class="feed">${gh.recent.map(r => html`<li key=${r.id}><span>Pushed to <strong>${r.name}</strong></span><time>${ago(r.at)}</time></li>`)}</ul>
    <p class="note">${gh.eventsOk ? "GitHub has no public events from the last 90 days, so this shows the most recent repository updates instead." : "GitHub’s activity feed couldn’t load, so this shows the most recent repository updates instead."}</p></div>`;
  return html`<p class="lead">${gh.status === "sample" ? "Recent activity couldn’t load right now. Try again in a few minutes." : "No recent public activity."}</p>`;
}

/* Contact form: posts to your form service (Formspree) or falls back to a pre-filled email */
function ContactForm({ C }) {
  const empty = { name: "", email: "", message: "", website: "" }; // "website" = hidden spam trap
  const [f, setF] = useState(empty);
  const [st, setSt] = useState("idle"); // idle | sending | sent | error
  const set = k => e => setF({ ...f, [k]: e.target.value });

  async function send(e) {
    e.preventDefault();
    if (f.website || st === "sending") return; // bots fill the hidden field
    const mailto = `mailto:${C.email}?subject=${encodeURIComponent("Portfolio message from " + f.name)}&body=${encodeURIComponent(f.message + "\n\n" + f.name + " (" + f.email + ")")}`;
    if (!CONFIG.formEndpoint) { window.location.href = mailto; return; }
    setSt("sending");
    try {
      const r = await fetch(CONFIG.formEndpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json", Accept: "application/json" },
        body: JSON.stringify({ name: f.name, email: f.email, message: f.message })
      });
      if (!r.ok) throw new Error("send failed");
      setSt("sent"); setF(empty);
    } catch (err) { setSt("error"); }
  }

  return html`<form class="contact" onSubmit=${send}>
    <label>Your name<input required maxLength="80" autocomplete="name" value=${f.name} onInput=${set("name")} /></label>
    <label>Your email<input required type="email" maxLength="120" autocomplete="email" value=${f.email} onInput=${set("email")} /></label>
    <label>Message<textarea required maxLength="2000" value=${f.message} onInput=${set("message")}></textarea></label>
    <div class="hp" aria-hidden="true"><label>Website<input tabIndex="-1" autocomplete="off" value=${f.website} onInput=${set("website")} /></label></div>
    <button class="btn" type="submit" disabled=${st === "sending"}>${st === "sending" ? "Sending…" : "Send message"}</button>
    <div aria-live="polite">
      ${st === "sent" && html`<p>Thanks! Your message was sent.</p>`}
      ${st === "error" && html`<p>Couldn’t send that. Please email me at <a href=${`mailto:${C.email}`}>${C.email}</a> instead.</p>`}
    </div>
  </form>`;
}

function App() {
  const C = useProfile(); // live-merged profile (defaults < GitHub bio < profile.json)
  const gh = useGithub(C.githubUser);
  const [theme, setTheme] = useState("");
  useEffect(() => { if (theme) document.documentElement.dataset.theme = theme; }, [theme]);
  const toggleTheme = () => {
    const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    setTheme(cur === "dark" ? "light" : "dark");
  };
  const badge = gh.status === "live" ? "Live from GitHub" : gh.status === "sample" ? "Sample data" : "Loading…";
  const [first, ...rest] = C.name.split(" ");
  const ed = C.education[0];
  const facts = [
    ["Based in", C.location],
    ["Studying", ed && [ed.degree, ed.school].filter(Boolean).join(", ")],
    ["Learning", C.learning.join(", ")]
  ].filter(([, v]) => v);

  return html`<div>
    <nav class="top" aria-label="Primary"><div class="in">
      <a class="mark" href="#top">${first[0]}${(rest[0] || "")[0]}</a>
      <a href="#about">About</a><a href="#experience">Experience</a><a href="#featured">Projects</a><a href="#github">GitHub</a><a href="#contact">Contact</a>
      <button type="button" aria-label="Toggle light and dark theme" onClick=${toggleTheme}>◐</button>
    </div></nav>

    <main id="top">
      <header class="wrap hero">
        <div class="hero-copy">
          <p class="status"><i></i>Open to new opportunities</p>
          <h1>${first}<br />${rest.join(" ")}</h1>
          <p class="role">${C.title} based in ${C.location}</p>
          <p class="lead">${C.bio}</p>
          <div class="cta">
            <a class="btn" href="#contact">Send a message</a>
            <a class="btn alt" href=${C.linkedinUrl} target="_blank" rel="noopener noreferrer">LinkedIn</a>
            <a class="btn alt" href=${`https://github.com/${C.githubUser}`} target="_blank" rel="noopener noreferrer">GitHub</a>
          </div>
        </div>
        <${Portrait} C=${C} />
      </header>

      <section class="sec wrap" id="about"><h2>About</h2>
        <div class="about">
          <div><p class="lead">${C.about}</p>
            <div class="chips">${C.skills.map(k => html`<span class="chip" key=${k}>${k}</span>`)}</div></div>
          <dl class="facts">${facts.map(([k, v]) => html`<div key=${k}><dt>${k}</dt><dd>${v}</dd></div>`)}</dl>
        </div>
      </section>

      <section class="sec wrap" id="experience"><h2>Experience</h2>
        ${C.experience.length
          ? html`<ol class="tl">${C.experience.map((j, i) => html`<li key=${i}>
              <div class="tl-when"><span>${j.when}</span><span>${j.location}</span></div>
              <div><h3>${j.role}</h3><p class="org">${j.org}</p>${j.desc && html`<p class="d">${j.desc}</p>`}</div></li>`)}</ol>`
          : html`<p class="lead">Experience will appear here automatically. Add it to <code>profile.json</code> in your GitHub profile repo.</p>`}
        ${C.education.length > 0 && html`<h3 class="sub">Education</h3>
          <ol class="tl">${C.education.map((j, i) => html`<li key=${i}>
            <div class="tl-when"><span>${j.when}</span></div>
            <div><h3>${j.degree}</h3><p class="org">${j.school}</p>${j.desc && html`<p class="d">${j.desc}</p>`}</div></li>`)}</ol>`}
        ${C.certifications.length > 0 && html`<h3 class="sub">Certifications</h3>
          <ul class="certs">${C.certifications.map(c => html`<li key=${c}>${c}</li>`)}</ul>`}
      </section>

      <section class="sec wrap" id="featured"><h2>Featured projects</h2>
        <div class="projs">${C.featured.map((j, i) => html`<article class=${"proj" + (i === 0 ? " wide" : "")} key=${j.name}>
          <h3>${j.name}</h3><p>${j.desc}</p>
          ${j.url && html`<a class="plink" href=${j.url} target="_blank" rel="noopener noreferrer">${j.label || "View project"}</a>`}
          <ul class="tags">${tags(j.tech).map(t => html`<li key=${t}>${t}</li>`)}</ul>
        </article>`)}</div>
      </section>

      <section class="sec wrap" id="github"><h2>On GitHub<span class="badge">${badge}</span></h2>
        <${Repos} gh=${gh} />
        <h3 class="sub">Recent activity</h3>
        <${Activity} gh=${gh} />
      </section>

      <section class="sec wrap" id="contact"><div class="panel">
        <div>
          <h2>Get in touch</h2>
          <p class="lead">I’m open to internships and junior roles in web development and security. Send a message and I’ll reply by email.</p>
          <ul class="links"><li><a href=${`mailto:${C.email}`}>${C.email}</a></li></ul>
        </div>
        <${ContactForm} C=${C} />
      </div></section>
    </main>
    <footer><div class="wrap">© ${new Date().getFullYear()} ${C.name}</div></footer>
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
